<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>AR Kelompok 5 Minggu 2 (Scene v1)</title>
  <!-- Pustaka A-Frame dan AR.js dari CDN -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- PENCAHAYAAN (LIGHTING) -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <!-- MARKER HIRO -->
    <a-marker preset="hiro">
      
      <!-- 1. Alas bidang datar (diputar -90 derajat agar rebah) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="2" height="2" color="#e9e5fa" opacity="0.7" transparent="true"></a-plane>

      <!-- 2. Kubus biru di sebelah kiri -->
      <a-box position="-0.6 0.25 0" width="0.5" height="0.5" depth="0.5" color="#406BF5"></a-box>

      <!-- 3. Bola oranye di tengah (ANIMASI NAIK-TURUN MEMBAL) -->
      <a-sphere position="0 0.3 0" radius="0.25" color="#D9531E" metalness="0.2" roughness="0.4"
                animation="property: position; dir: alternate; to: 0 0.8 0; dur: 1000; loop: true">
      </a-sphere>

      <!-- 4. Silinder hijau di sebelah kanan -->
      <a-cylinder position="0.6 0.3 0" radius="0.2" height="0.6" color="#087F73"></a-cylinder>

      <!-- 5. Kotak bertekstur di depan (memuat gambar dari folder assets) -->
      <a-box position="0 0.15 0.7" width="0.5" height="0.3" depth="0.5" src="assets/tekstur.jpg"></a-box>

    </a-marker>

    <!-- KAMERA -->
    <a-entity camera></a-entity>
    
  </a-scene>
</body>
</html>
